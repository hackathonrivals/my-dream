<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Generate PWA Icons</title>
<style>
  body { font-family: system-ui; background: #08090d; color: #e9ebf2; display: grid; place-items: center; min-height: 100vh; margin: 0; }
  .container { text-align: center; padding: 40px; }
  h1 { margin-bottom: 10px; }
  p { color: #8b90a4; margin-bottom: 30px; }
  canvas { border: 1px solid #333; border-radius: 10px; margin: 10px; }
  button { padding: 12px 24px; background: linear-gradient(135deg, #7c5cff, #22d3ee); color: #08090d; border: none; border-radius: 10px; font-weight: 700; cursor: pointer; font-size: 16px; margin: 10px; }
  button:hover { transform: translateY(-2px); }
</style>
</head>
<body>
<div class="container">
  <h1>Hackathon Rivals - PWA Icon Generator</h1>
  <p>Click the buttons below to download the icons</p>
  <canvas id="c192" width="192" height="192"></canvas>
  <canvas id="c512" width="512" height="512"></canvas>
  <br>
  <button onclick="downloadIcon(192)">Download 192x192</button>
  <button onclick="downloadIcon(512)">Download 512x512</button>
</div>
<script>
function drawIcon(canvas, size) {
  const ctx = canvas.getContext('2d');
  
  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#7c5cff');
  grad.addColorStop(1, '#22d3ee');
  
  // Rounded rect
  const r = size * 0.22;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();
  
  // Text
  ctx.fillStyle = '#08090d';
  ctx.font = `bold ${size * 0.46}px system-ui, -apple-system, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('HR', size / 2, size / 2 + size * 0.02);
}

drawIcon(document.getElementById('c192'), 192);
drawIcon(document.getElementById('c512'), 512);

function downloadIcon(size) {
  const canvas = document.getElementById('c' + size);
  const link = document.createElement('a');
  link.download = `icon-${size}.png`;
  link.href = canvas.toDataURL('image/png');
  link.click();
}
</script>
</body>
</html>
